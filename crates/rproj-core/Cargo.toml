[package]
name = "rproj-core"
version = "0.22.0"
edition = "2024"
rust-version = "1.89"
description = "Shared project inspection and operations for rproj"
license = "MIT"
repository = "https://github.com/chatarabdelilah/rproj"

[features]
template-editor = ["dep:rbx_reflection", "dep:rbx_reflection_database", "dep:rbx_types"]

[dependencies]
rbx_reflection = { version = "7.0.0", optional = true }
rbx_reflection_database = { version = "3.0.0", optional = true }
rbx_types = { version = "3.1.0", optional = true }
anyhow = "1.0.104"
semver = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
toml = "1.1.3"
directories = "6.0.0"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
process-wrap = { version = "=10.0.1", features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"], default-features = false }
tokio = { version = "1.48", features = ["rt", "process", "io-util", "time"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
