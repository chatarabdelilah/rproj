[package]
name = "rproj-desktop"
version = "0.22.0"
edition = "2024"
rust-version = "1.99"
description = "Native workbench for existing Roblox and Luau projects"
license = "MIT"
repository = "https://github.com/chatarabdelilah/rproj"
publish = false

[dependencies]
anyhow = "1.0.104"
gpui-kit = "=0.7.1"
rproj-core = { path = "../rproj-core", version = "=0.22.0" }
serde_json = "1.0.151"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
tempfile = "3.27.0"
