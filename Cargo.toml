[package]
name = "rproj"
version = "0.8.1"
edition = "2024"
rust-version = "1.89"
description = "Guided bootstrap-to-game-dev CLI for Roblox: takes a fresh Windows PC to a working Roblox/Luau setup, then scaffolds projects on it"
authors = ["Chatar Abdelilah <chatar.abdelilah.s@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/chatarabdelilah/rproj"

exclude = ["docs/", ".github/", ".codegraph/"]
keywords = ["roblox", "luau", "rojo", "wally", "scaffold"]
categories = ["command-line-utilities", "development-tools", "game-development"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
inquire = "0.9.4"
notify-rust = "4.18.0"
anstream = "1.0.0"
anstyle = "1.0.14"
crossterm = "0.29.0"
unicode-width = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
ureq = "3.3.0"
walkdir = "2.5.0"

[dev-dependencies]
portable-pty = "0.8.1"
# Turns the pty byte stream back into a screen. ConPTY is free to express
# the same output as newlines or as cursor moves, and which one it picks
# varies with load - matching on the raw bytes was flaky under a parallel
# `cargo test` and solid when run alone. Assertions run against the
# rendered screen instead, where a line break is a line break.
vt100 = "0.15.2"
