[package]
name = "rproj"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
inquire = "0.9.4"
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
ureq = "3.3.0"
walkdir = "2.5.0"

[dev-dependencies]
# Drives rproj's own prompts in the integration tests. inquire reads the
# console input handle directly, so piped stdin is ignored and the process
# hangs forever - a real pseudo-terminal is the only way to answer it
# without a human at the keyboard.
portable-pty = "0.8.1"
# Turns the pty byte stream back into a screen. ConPTY is free to express
# the same output as newlines or as cursor moves, and which one it picks
# varies with load - matching on the raw bytes was flaky under a parallel
# `cargo test` and solid when run alone. Assertions run against the
# rendered screen instead, where a line break is a line break.
vt100 = "0.15.2"
